# Compression menu actions
#
# This file is a MenuActions map: each key is an action name shown in the
# menu overlay. Actions are gated with `have:program` rules so a format only
# appears when its compressor is on PATH (evaluated when the menu opens).
#
# The command is a lua script executed with (paths, dst, nav_cwd): the
# targeted absolute paths as a lua table `paths`, the destination `dst`
# (empty for direct menu calls), and the navigation directory `nav_cwd` (optional).
# The archive is written next to the first target, or into `dst` when it is
# non-empty.

["zip"]
strategy = "Exec"
help = "Select an existing .zip archive first to append to it; otherwise a new archive is created next to the first selected path (or in --dest)."
condition = { selected = "active", condition = "have:zip" }
command = """
local is_archive = paths[1]:lower():match("%.zip$") ~= nil
local archive = is_archive and paths[1] or path.join(dst ~= "" and dst or path.parent(paths[1]), path.base(paths[1]) .. ".zip")
if is_archive and path.is_empty(archive) then os.remove(archive) end
local first_idx = is_archive and 2 or 1
local same_parent = true
local common_dir = path.parent(paths[first_idx] or paths[1])
for i = first_idx, #paths do
  if path.parent(paths[i]) ~= common_dir then
    same_parent = false
    break
  end
end
local names = {}
if same_parent then
  for i = first_idx, #paths do names[#names + 1] = util.shq("./" .. path.base(paths[i])) end
else
  for i = first_idx, #paths do names[#names + 1] = util.shq(paths[i]) end
end
if #names == 0 then error("no files to add to " .. path.base(archive)) end
local cmd = same_parent
  and ("cd " .. util.shq(common_dir) .. " && zip -rq " .. util.shq(archive) .. " " .. table.concat(names, " "))
  or ("zip -rq -j " .. util.shq(archive) .. " " .. table.concat(names, " "))
local ok, how, code = os.execute(cmd)
if not ok then error("zip failed: " .. tostring(code)) end
toast_push("success", is_archive and "Updated: " or "Compressed: ", path.base(archive))
"""

