["tar.gz"]
strategy = "Exec"
help = "Select an existing .tar.gz/.tgz archive first to append to it; otherwise a new archive is created next to the first selected path (or in --dest)."
condition = { selected = "active", condition = "have:tar" }
command = """
local is_archive = paths[1]:lower():match("%.tar%.gz$") ~= nil or paths[1]:lower():match("%.tgz$") ~= nil
local archive = is_archive and paths[1] or path.join(dst ~= "" and dst or path.parent(paths[1]), path.base(paths[1]) .. ".tar.gz")
local empty = is_archive and path.is_empty(archive)
local first_idx = is_archive and 2 or 1
local same_parent = true
local common_dir = path.parent(paths[first_idx] or paths[1])
for i = first_idx, #paths do
  if path.parent(paths[i]) ~= common_dir then
    same_parent = false
    break
  end
end
local names = {}
if same_parent then
  for i = first_idx, #paths do names[#names + 1] = util.shq(path.base(paths[i])) end
else
  for i = first_idx, #paths do
    names[#names + 1] = "-C " .. util.shq(path.parent(paths[i])) .. " " .. util.shq(path.base(paths[i]))
  end
end
if #names == 0 then error("no files to add to " .. path.base(archive)) end
local cd_prefix = same_parent and ("cd " .. util.shq(common_dir) .. " && ") or ""
local cmd
if is_archive and not empty then
  local tar_file = archive:gsub("%.tar%.gz$", ".tar"):gsub("%.tgz$", ".tar")
  cmd = cd_prefix .. "gzip -df " .. util.shq(archive) .. " && { tar -rf " .. util.shq(tar_file) .. " -- " .. table.concat(names, " ") .. "; st=$?; gzip -f " .. util.shq(tar_file) .. "; exit $st; }"
else
  cmd = cd_prefix .. "tar -czf " .. util.shq(archive) .. " -- " .. table.concat(names, " ")
end
local ok, how, code = os.execute(cmd)
if not ok then error("tar.gz failed: " .. tostring(code)) end
toast_push("success", is_archive and "Updated: " or "Compressed: ", path.base(archive))
"""

