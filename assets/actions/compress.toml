["7z"]
strategy = "Exec"
help = "Select an existing .7z archive first to append to it; otherwise a new archive is created next to the first selected path (or in --dest)."
condition = { selected = "active", condition = "have:7z" }
command = """
local is_archive = paths[1]:lower():match("%.7z$") ~= nil
local archive = is_archive and paths[1] or path.join(dst ~= "" and dst or path.parent(paths[1]), path.base(paths[1]) .. ".7z")
if is_archive and path.is_empty(archive) then os.remove(archive) end
-- Absolute paths let one archive hold selections from different directories.
-- 7z stores the basenames, not the temporary directory prefixes.
local names = {}
for i = (is_archive and 2 or 1), #paths do names[#names + 1] = util.shq(paths[i]) end
if #names == 0 then error("no files to add to " .. path.base(archive)) end
local ok, how, code = os.execute(
  "7z a -bd " .. util.shq(archive) .. " " .. table.concat(names, " "))
if not ok then error("7z failed: " .. tostring(code)) end
toast_push("success", is_archive and "Updated: " or "Compressed: ", path.base(archive))
"""
