# Compression menu actions (shipped plugin).
#
# This file is a MenuActions map: each key is an action name shown in the
# menu overlay. Actions are gated with `have:program` rules so a format only
# appears when its compressor is on PATH (evaluated when the menu opens).
#
# The command is a lua script executed with (paths, dst, nav_cwd): the
# targeted absolute paths as a lua table `paths`, the destination `dst`
# (empty for direct menu calls), and the navigation directory `nav_cwd` (optional).
# The archive is written next to the first target, or into `dst` when it is
# non-empty.

["zip"]
strategy = "Execute"
condition = { condition = "have:zip" }
command = """
local function shq(s) return "'" .. tostring(s):gsub("'", "'\\''") .. "'" end
local function base(p) return p:match("([^/]+)/?$") or "." end
local function parent(p) return p:match("^(.*)/") or "." end
local src_dir = parent(paths[1])
local out_dir = dst ~= "" and dst or src_dir
local archive = out_dir .. "/" .. base(paths[1]) .. ".zip"
local names = {}
for _, p in ipairs(paths) do names[#names + 1] = shq("./" .. base(p)) end
local ok, how, code = os.execute(
  "cd " .. shq(src_dir) .. " && zip -rq " .. shq(archive) .. " " .. table.concat(names, " "))
if not ok then error("zip failed: " .. tostring(code)) end
toast_push("success", "Compressed: ", base(archive))
"""

["tar.gz"]
strategy = "Execute"
condition = { condition = "have:tar" }
command = """
local function shq(s) return "'" .. tostring(s):gsub("'", "'\\''") .. "'" end
local function base(p) return p:match("([^/]+)/?$") or "." end
local function parent(p) return p:match("^(.*)/") or "." end
local src_dir = parent(paths[1])
local out_dir = dst ~= "" and dst or src_dir
local archive = out_dir .. "/" .. base(paths[1]) .. ".tar.gz"
local names = {}
for _, p in ipairs(paths) do names[#names + 1] = shq(base(p)) end
local ok, how, code = os.execute(
  "cd " .. shq(src_dir) .. " && tar -czf " .. shq(archive) .. " -- " .. table.concat(names, " "))
if not ok then error("tar.gz failed: " .. tostring(code)) end
toast_push("success", "Compressed: ", base(archive))
"""

