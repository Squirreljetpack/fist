# Diff and comparison menu actions.

["diff"]
prefix = ""

strategy = "ExecPaged"
condition = ["type:f", "type:f"]
command = """
local p1 = util.shq(paths[1])
local p2 = util.shq(paths[2])
local ok, how, code = os.execute("diff -u --color=always " .. p1 .. " " .. p2 .. " 2>/dev/null")
if not ok and code ~= 1 then
  local g_ok = os.execute("git diff --no-index --color=always " .. p1 .. " " .. p2)
  if g_ok then
    print(lunacolors.bold("Files are identical:") .. "\\n  " .. paths[1] .. "\\n  " .. paths[2])
  end
elseif ok then
  print(lunacolors.bold("Files are identical:") .. "\\n  " .. paths[1] .. "\\n  " .. paths[2])
end
"""

["compare"]
prefix = ""

strategy = "ExecPaged"
condition = { any = [["type:text", "type:text"], ["type:text", "type:d"], ["type:d", "type:text"], ["type:d", "type:d"]] }
command = """
local comp1 = paths[1]
local comp2 = paths[2]

local is_dir1 = path.is_dir(comp1)
local is_dir2 = path.is_dir(comp2)

if is_dir1 and is_dir2 then
  local c1 = comp1:gsub("/+$", "") .. "/"
  local c2 = comp2:gsub("/+$", "") .. "/"
  if c2:sub(1, #c1) == c1 or c1:sub(1, #c2) == c2 then
    error("Directories cannot be direct descendants of the other!")
  end
end

local function get_items(target, is_dir)
  local set = {}
  if is_dir then
    local p = io.popen("cd " .. util.shq(target) .. " && fs -u --list 2>/dev/null")
    if p then
      for line in p:lines() do
        set[line] = true
      end
      p:close()
    end
  else
    local f, err = io.open(target, "r")
    if not f then
      error("failed to open " .. target .. ": " .. tostring(err))
    end
    for line in f:lines() do
      set[line] = true
    end
    f:close()
  end
  return set
end

local set1 = get_items(comp1, is_dir1)
local set2 = get_items(comp2, is_dir2)

local only1 = {}
local both = {}
for line in pairs(set1) do
  if set2[line] then
    both[#both + 1] = line
  else
    only1[#only1 + 1] = line
  end
end
table.sort(only1)
table.sort(both)

local only2 = {}
for line in pairs(set2) do
  if not set1[line] then
    only2[#only2 + 1] = line
  end
end
table.sort(only2)

print("\\n" .. lunacolors.bold(lunacolors.underline(comp1 .. " / " .. comp2)))
for _, line in ipairs(only1) do print(line) end

print("\\n" .. lunacolors.bold(lunacolors.underline(comp2 .. " / " .. comp1)))
for _, line in ipairs(only2) do print(line) end

print("\\n" .. lunacolors.bold(lunacolors.underline(comp1 .. " ^ " .. comp2)))
for _, line in ipairs(both) do print(line) end
"""
