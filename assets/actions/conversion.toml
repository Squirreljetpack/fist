# Media conversion menu actions

["to webp"]
prefix = "image"

strategy = "ExecSilent"
condition = { selected = "active", condition = ["mime:image/*", "have:cwebp"] }
command = """
for _, p in ipairs(paths) do
  local out_dir = to ~= "" and to or path.parent(p)
  local out_file = path.join(out_dir, path.stem(p) .. ".webp")
  if out_file == p then
    out_file = path.unique(path.join(out_dir, path.stem(p) .. "_converted.webp"))
  elseif to == "" and path.exists(out_file) then
    out_file = path.unique(out_file)
  end
  local res = proc.run("cwebp", {"-q", "85", p, "-o", out_file})
  if res.ok then
    toast_push("success", "Converted: ", path.base(out_file))
  else
    toast_push("error", "Failed: ", path.base(p))
  end
end
"""

