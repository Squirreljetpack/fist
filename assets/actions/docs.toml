# Document menu actions: merge and split PDFs with qpdf.

["merge"]
prefix = "pdf"

strategy = "Queue"
condition = { selected = 2, condition = ["mime:application/pdf", "have:qpdf"] }
command = """
-- merge the selected pdfs, in selection order, into one file
local out_dir = dst ~= "" and dst or path.parent(paths[1])
local out_file = path.unique(path.join(out_dir, path.stem(paths[1]) .. "-merged.pdf"))
local args = { "--empty", "--pages" }
for _, p in ipairs(paths) do args[#args + 1] = p end
args[#args + 1] = "--"
args[#args + 1] = out_file

local res = proc.run("qpdf", args)
if res.ok then
  toast_push("success", "Merged: ", path.base(out_file) .. " (" .. #paths .. " files)")
else
  toast("error", "qpdf: " .. res.stderr)
end
"""

["split"]
prefix = "pdf"

strategy = "Queue"
condition = { selected = "active", condition = ["mime:application/pdf", "have:qpdf"] }
command = """
-- one pdf per page, named <stem>-<page>.pdf
for i, p in ipairs(paths) do
  set_progress(math.floor((i - 1) / #paths * 255))
  local out_dir = dst ~= "" and dst or path.parent(p)
  -- the page number comes from qpdf's pattern, so uniquify the stem instead
  local stem = path.stem(p)
  local base, n = stem, 1
  while path.exists(path.join(out_dir, base .. "-1.pdf")) do
    base = stem .. "_" .. n
    n = n + 1
  end

  local pattern = path.join(out_dir, base .. "-%d.pdf")
  local res = proc.run("qpdf", { "--split-pages", p, pattern })
  if res.ok then
    toast_push("success", "Split pages: ", base)
  else
    toast_push("error", "Failed: ", path.base(p))
  end
end
set_progress(255)
"""
