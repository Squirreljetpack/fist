[tui]
min = 12
# when system clipboard cannot be (i.e. over ssh), this falls back to osc52.
# set to true to never use the system clipboard.
osc52 = false
scroll = "Expansive"
percentage = 70

[ui]
mouse_events = true

[status]
show = true

[results]
delay_clear = true
wrap = true
scroll_wrap = true
row_connection = "Disjoint"
# inactive.fg = "LightYellow"
# inactive_current.fg = "LightYellow"

# default
[[preview.layout]]
side = "right"
percentage = 40
min = 30
max = 120
border = { type = "LightDoubleDashed", color = "DarkGray" }

# find
[[preview.layout]]
side = "top"
percentage = 50
min = 5
max = 50
border = { type = "LightDoubleDashed", color = "DarkGray" }

# wide
[[preview.layout]]
side = "right"
percentage = 80
min = 5
max = 200
border = { type = "LightDoubleDashed", color = "DarkGray" }

# app
[[preview.layout]]
side = "left"
percentage = 70
min = 5
max = 20

[preview]
wrap = true
scroll_wrap = true

# How `<MM_IMAGE>` preview output is rendered (values are the defaults).
[preview.image]
# protocol = "auto" # auto|characters|sixel|kitty|iterm2|none
# horizontal_fit = "contain" # contain[:cells]|fill[:cells]|crop
# vertical_fit = "crop"
# filter = "triangle" # nearest|triangle|catmull-rom|gaussian|lanczos3
# scroll = 0

# Preview command handling.
[previewer]
# parse `<MM_IMAGE>` headers in preview command output
# images = true

[overlay]
border = { type = "Rounded", color = "darkGrey", padding = 1 }

[query]
border = { type = "Rounded", sides = "ALL", color = "blue" }
# word movement stops at these characters in addition to whitespace
word_boundaries = ['.', '/']
reset_cursor_on_query_change = true

[prompt]
# characters kept between the cursor and the left edge of prompt bars
# (New, NewFolder, Rename, Goto, Extract, SetAlias)
# scroll_padding_left = 3

[binds]
# Prompt locking: Arrow keys navigate when unlocked, and move cursor when locked
"prompt^^shift-left" = "Parent"
"prompt^^shift-right" = "Advance"
"prompt^^left" = "BackwardChar"
"prompt^^right" = "ForwardChar"
"prompt^^ctrl-h" = "DeleteWord"
"left" = "Parent"
"right" = "Advance"
"shift-left" = "BackwardChar"
"shift-right" = "ForwardChar"
"ctrl-space" = "LockPrompt"
"alt-hyphen" = "LockPrompt"
# Consistent scheme: Arrow keys always move the cursor
# "shift-left" = "Parent"
# "shift-right" = "Advance"

### MM
"tab" = ["ToggleSelection", "Down"]
"ctrl-a" = "CycleSelections"
"ctrl-shift-a" = "ClearSelections"
"alt-shift-a" = "Pos(0)" # cursor to query start
"alt-shift-e" = "Pos(-1)" # cursor to query end
"alt-enter" = "Print"
"alt-r" = "Reload"

"ctrl-[" = "ToggleWrap" # requires keyboard enhancement
"ctrl-]" = "TogglePreviewWrap" # requires keyboard enhancement
"alt-{" = "ToggleWrap"
"alt-}" = "TogglePreviewWrap"

"ctrl-shift-right" = "HScroll(1)"
"ctrl-shift-left" = "HScroll(-1)"
"ctrl-shift-up" = "VScroll(1)"
"ctrl-shift-down" = "VScroll(-1)"

"alt-right" = "HScroll(1)"
"alt-left" = "HScroll(-1)"
"alt-up" = "VScroll(1)"
"alt-down" = "VScroll(-1)"

### Panes

"ctrl-f" = "Find"
"ctrl-r" = "Search"
"ctrl-g" = "History"
"ctrl-z" = "Undo"
"ctrl-shift-z" = "Redo" # requires keyboard enhancement
"alt-z" = "Redo"
"ctrl-`" = "Jump" # requires keyboard enhancement
"alt-`" = "Jump"

### Display
"alt-u" = "ShowQueue"
"alt-shift-u" = "ClearQueue"
"alt-e" = "ShowMenu"
"ctrl-e" = "ShowMenu"
"ctrl-u" = "ClearQuery"
"alt-p" = "ShowOptions"
"ctrl-p" = "ShowOptions"
"ctrl-d" = "CycleFilter"
"ctrl-s" = "ToggleFilter" # if this freezes your terminal, check that you have set stty -ixon

### File Actions
"ctrl-v" = "Paste"
"ctrl-x" = "Move"
"ctrl-c" = "Copy"
"ctrl-n" = "New"
"ctrl-shift-n" = "NewFolder"
"ctrl-y" = "CopyPath"
"delete" = "Trash"
"shift-delete" = "Delete"
"f2" = "Rename"
"ctrl-shift-r" = "Rename"

"ctrl-h" = "Trash"
"cmd-backspace" = "Trash"
# alternative if no delete key:
"ctrl-shift-backspace" = "Delete"
"shift-cmd-backspace" = "Delete"
"alt-backspace" = "DeleteWord"

### Stash
# "alt-s" = "PushStash"
# "alt-shift-s" = "OpenStash"
# "alt-b" = "PushStash(bookmark)"
# "alt-shift-b" = "OpenStash(bookmark)"
"alt-s" = "Stash"
"alt-b" = "Stash(bookmark)"

### Preview / Execute
### (DEFAULTS) ####
# "?" = "LFPreview(Preview)"
# "alt-/" = "LFPreview(Info)"
"alt-i" = "LFPreview(Info)"
"alt-shift-i" = "LFPreview(Display)"
# "alt-h" = "Help"
# "alt-shift-/" = "LFPreview(Display)"

# This one acts on the parent directory if a file is selected.
# Note that the "Directory" action in the edit preset defers to $VISUAL.
"alt-n" = "Lessfilter(Edit)"
"ctrl-enter" = "Lessfilter(Open)"
"alt-o" = "Lessfilter(Open)"
# A free preset for any user purpose (configure in lessfilter.toml)
# This can be used to open a *file* with $VISUAL
"alt-8" = "LFPaged(Alternate)"
# Maximize preview
# Incidentally, this is same as ExecutePaged(eval $FS_PREVIEW_COMMAND)
"ctrl-l" = "LFPaged(Preview)"
# "full" or interactive terminal output
"alt-l" = "LFPaged(Extended)"
# open a shell in the current directory
"ctrl-esc" = "Execute($SHELL)" # (requires keyboard enhancement)

### JumpOrAccept
"alt-space" = "JumpOrAccept(0)"
"ctrl-1" = "JumpOrAccept(1)"
"ctrl-2" = "JumpOrAccept(2)"
"ctrl-3" = "JumpOrAccept(3)"
"ctrl-4" = "JumpOrAccept(4)"
"ctrl-5" = "JumpOrAccept(5)"
"ctrl-6" = "JumpOrAccept(6)"
"ctrl-7" = "JumpOrAccept(7)"
"ctrl-8" = "JumpOrAccept(8)"
"ctrl-9" = "JumpOrAccept(9)"
