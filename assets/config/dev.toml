### PANES ###
#
[panes.nav]
show_preview = 60
lock_prompt = false

default_visibility = { hidden = true }

[panes.find]
show_preview = 60
lock_prompt = true

on_leave_unset_dirs_only = true

[panes.search]
lock_prompt = true
show_preview = 20
preview_layout_index = 1

one_line = true
default_visibility = { ignore = true }
default_sort = "none"

rg_status_template = '''
{blue:filter: {}} \s\m/\t
'''
fs_status_template = '''
{red:query: {}} \s\m/\t
'''

### STYLES ####
#
[styles]
# Per-level toast styles (each is a StyleSetting: fg/bg/modifier).
# [styles.toast]
# normal = { fg = "DarkGray", modifier = "ITALIC" }
# info = { fg = "LightBlue" }
# success = { fg = "Green" }
# warning = { fg = "Yellow" }
# error = { fg = "Red" }
### SETTINGS ###
#
[fd]

[rg]

[notify]

[misc]
append_mode_logging = true

[history]
refind = "Search"
