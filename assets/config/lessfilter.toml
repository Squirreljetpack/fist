# ==============================
#   Rule Matching
# ==============================

# In event of a tie, first one wins.

# ----------
#   Syntax
# ----------
# Add:           +{value}|{rule}  or  +{rule} (Add(1))
# Sub:           -{value}|{rule}  or  -{rule} (Sub(1))
# Max:           >{value}|{rule}, {value}|{rule}  or  >{rule} (Max(1))
# Min:           <{value}|{rule}  or  <{rule} (Min(1))
# Req:           ^|{rule}  or  ^{rule}
# Invert:        !{rule}  (e.g. !have:sqlite3, 1|!cat:document)
# Escape:        \{rule}  (treats modifier characters literally)
# Default Score: {rule}   (uses rule's default score)

# ------------------
#   Default scores
# ------------------
# application: Max(60)
# glob:        Max(50)
# child:       Max(50)
# ext:         Max(30)
# mime:        Max(20)
# cat:         Max(20)
# *:           Max(0)
# have:        Req
# filetype:    Req
# git:         Req

# ------------------
#   File Rules
# ------------------
# glob:{pat}        test the full path against a glob pattern.
# child:{pat}       whether the name of any child matches this glob (for a file, matches siblings).
# ext:{ext}, .{ext} file extension (e.g. .txt, .rs, .html, .png)
# mime:{m}, {m}     MIME type (e.g. text/plain, image/*, application/vnd.sqlite3)
# cat:{cat}         file category (built-in category, or defined in [categories])
# have:{cmd}        check whether this program exists in PATH.
# filetype:{type}   file, directory, symlink, blockdevice, chardevice, executable, empty, socket, pipe, text
# git               path is inside a Git work tree.
# application, app  platform application bundle, launcher, or executable.
# *                 match any path.

# ------------------------------------------------------------ #

[rules]
default = [
    [["Directory"], ["1|directory/*"]],
    [["Text"], ["1|type:text"]],
    [
        ["Extract", "Metadata"], # try extracting, with fallback to metadata
        ["1|cat:document", "1|cat:spreadsheet", "1|cat:email", "1|cat:academic"],
    ],
    [["Image"], ["1|image/*"]],
    [["Metadata"], ["1|*/*"]],
]

# f:st's preview
preview = [
    [["Application"], ["application"]],
    [["sqlite"], ["application/vnd.sqlite3", "have:sqlite3"]],
]

# the 'n' alias, and the `Advance` action in the ui
edit = [
    [["Open"], ["1|cat:document", "1|cat:spreadsheet", "1|cat:email", "1|cat:academic"]],
]

# the 'l' alias
display = [
    [
        ["Metadata"],
        ["1|cat:compressed"],
    ],
]

# the 'la' alias
extended = [
    # [ [ "rainfrog" ], [ "application/vnd.sqlite3" ] ],
    # [ ["fx"], [ ".yml", ".json", ".jsonl", ".yaml", ".jsonh" ] ],
]

# the 'll' alias
info = [
    [
        ["mediainfo"],
        [
            "image/*",
            "cat:image",
            "cat:video",
            "cat:audio",
            "cat:lossless",
            "cat:diagram",
            "cat:model",
            "have:mediainfo",
        ],
    ],
]

# opener
# Note: Directory, Text, Image, Metadata, Application all defer to fs: open in this preset and the next
open = [
    [["Open"], ["*"]]
]

alternate = [
    [
        # [ "code" ], [ "*/*" ]
        ["none"],
        ["*/*"],
    ],
]

[actions]
sqlite = '''
sqlite3 {} "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" |
while read -r tbl; do
    [[ -n $tbl ]] || continue;
    echo "== $tbl ($(sqlite3 {} "SELECT COUNT(*) FROM \"$tbl\";")) rows =="
    sqlite3 {} <<EOF
.headers on
.mode column
SELECT * FROM "$tbl" LIMIT 5;
EOF
    echo
done
'''

mediainfo = 'mediainfo {}'
