[tui]
percentage = 50
min = 10
max = 25
# copy via OSC52 escape sequences (text/path data only, not image bytes);
# set to false on terminals without OSC52 support to use the system clipboard
# osc52 = true
# keep one trailing newline when copying command output (CopyCommand/CopyCommandAsync)
# copy_trailing_newline = false

[ui]
mouse_events = true

[results]
wrap = true
scroll_wrap = true
row_connection = "Disjoint"

# default
[[preview.layout]]
side = "right"
percentage = 40
min = 30
max = 120
border = { type = "LightDoubleDashed", color = "DarkGray" }

# find
[[preview.layout]]
side = "top"
percentage = 50
min = 5
max = 50
border = { type = "LightDoubleDashed", color = "DarkGray" }

# wide
[[preview.layout]]
side = "right"
percentage = 80
min = 5
max = 200
border = { type = "LightDoubleDashed", color = "DarkGray" }

# app
[[preview.layout]]
side = "left"
percentage = 70
min = 5
max = 20

[preview]
wrap = true
scroll_wrap = true

[overlay]
border = { type = "Rounded", color = "darkGrey", padding = 1 }

[query]
border = { type = "Rounded", sides = "ALL", color = "blue" }
# word movement stops at these characters in addition to whitespace
word_boundaries = ['.', '/']

[binds]
# Alternate scheme:
# "shift-left" = "Parent"
# "shift-right" = "Advance"
# config.toml: interface.prompt_locking = false
"shift-left" = "BackwardChar"
"shift-right" = "ForwardChar"
"left" = "Parent"
"right" = "Advance"
"alt-space" = "LockPrompt"
"ctrl-space" = "LockPrompt"

### MM
"tab" = ["ToggleSelection", "Down"]
"ctrl-a" = "CycleSelections"
"ctrl-shift-a" = "ClearSelections"
"alt-enter" = "Print"
"alt-r" = "Reload"

"ctrl-[" = "ToggleWrap"        # requires keyboard enhancement
"ctrl-]" = "TogglePreviewWrap" # requires keyboard enhancement
"alt-{" = "ToggleWrap"
"alt-}" = "TogglePreviewWrap"

"ctrl-shift-right" = "HScroll(1)"
"ctrl-shift-left" = "HScroll(-1)"
"ctrl-shift-up" = "VScroll(1)"
"ctrl-shift-down" = "VScroll(-1)"

"alt-right" = "HScroll(1)"
"alt-left" = "HScroll(-1)"
"alt-up" = "VScroll(1)"
"alt-down" = "VScroll(-1)"

### Panes

"ctrl-f" = "Find"
"ctrl-r" = "Search"
"ctrl-g" = "History"
"ctrl-z" = "Undo"
"ctrl-shift-z" = "Redo" # requires keyboard enhancement
"alt-z" = "Redo"
"ctrl-`" = "Jump"       # requires keyboard enhancement
"alt-`" = "Jump"

### Display
"ctrl-u" = "ShowQueue"
"ctrl-shift-u" = "ClearQueue"
"alt-shift-u" = "ClearQueue"
"ctrl-e" = "ShowMenu"
"alt-u" = "ClearQuery"
"ctrl-p" = "ShowOptions"
"ctrl-d" = "FsToggle"
"ctrl-s" = "ToggleHidden"     # if this freezes your terminal, check that you have set stty -ixon

### File Actions
"ctrl-v" = "Paste"
"ctrl-x" = "Cut"
"ctrl-c" = "Copy"
"ctrl-n" = "New"
"ctrl-shift-n" = "NewDir"
"ctrl-y" = "CopyPath"
"delete" = "Trash"
"shift-delete" = "Delete"
"ctrl-shift-r" = "Rename"
# alternative if no delete key:
"ctrl-shift-backspace" = "Delete"
"shift-cmd-backspace" = "Delete"

### Stash
"alt-s" = "Push"

### Preview / Execute
### (DEFAULTS) ####
# "?" = "LFPreview(Preview)"
# "alt-/" = "LFPreview(Info)"
"alt-i" = "LFPreview(Info)"
"alt-shift-i" = "LFPreview(Display)"
# "alt-h" = "Help"
# "alt-shift-/" = "LFPreview(Display)"

# This one acts on the parent directory if a file is selected.
# Note that the "Directory" action in the edit preset defers to $VISUAL.
"alt-n" = "Lessfilter(Edit)"
"ctrl-enter" = "Lessfilter(Open)"
"alt-o" = "Lessfilter(Open)"
# A free preset for any user purpose (configure in lessfilter.toml)
# This can be used to open a *file* with $VISUAL
"alt-8" = "LFPaged(Alternate)"
# Maximize preview
# Incidentally, this is same as ExecutePaged(eval $FS_PREVIEW_COMMAND)
"ctrl-l" = "LFPaged(Preview)"
# "full" or interactive terminal output
"alt-l" = "LFPaged(Extended)"
# open a shell in the current directory
"ctrl-esc" = "Execute($SHELL)" # (requires keyboard enhancement)

### Autojump
"ctrl-0" = "AutoJump(0)"
"ctrl-1" = "AutoJump(1)"
"ctrl-2" = "AutoJump(2)"
"ctrl-3" = "AutoJump(3)"
"ctrl-4" = "AutoJump(4)"
"ctrl-5" = "AutoJump(5)"
"ctrl-6" = "AutoJump(6)"
"ctrl-7" = "AutoJump(7)"
"ctrl-8" = "AutoJump(8)"
"ctrl-9" = "AutoJump(9)"

### Custom menu actions
# NOTE: [actions] lives in config.toml — the example below documents the
# schema. Conditions: the action is visible iff at least one condition is
# satisfied (an empty list = always visible; a single condition object is
# accepted without the array wrapper). Strategies:
#   "Execute" / "ExecuteSilent" — run the lua command (waited / not waited;
#   "silent" is accepted as an alias);
#   "ExecPaged" — run the lua command and page its stdout;
#   "Stash" — enqueue all target items as one queue item;
#   { Batch = n } — enqueue queue items of at most n paths each.
# `close = true`/`false` overrides the strategy default (Stash/Batch keep the
# menu open; Execute/ExecuteSilent/ExecPaged close it).
# [actions]
# stash-log-files = {
#   condition = [{ repeat = { count = 1, condition = "ext:log", strict = true } }],
#   command = "print('queued')",
#   strategy = "Stash",
# }
