# ==============================
#   Rule Matching
# ==============================

# In event of a tie, first one wins.

# ----------
#   Syntax
# ----------
# Add:           +{value}|{rule}  or  +{rule} (Add(1))
# Sub:           -{value}|{rule}  or  -{rule} (Sub(1))
# Max:           >{value}|{rule}, {value}|{rule}  or  >{rule} (Max(1))
# Min:           <{value}|{rule}  or  <{rule} (Min(1))
# Req:           ^|{rule}  or  ^{rule}
# Invert:        !{rule}  (e.g. !have:sqlite3, 1|!cat:document)
# Escape:        \{rule}  (treats modifier characters literally)
# Default Score: {rule}   (uses rule's default score)

# ------------------
#   Default scores
# ------------------
# application: Max(60)
# glob:        Max(50)
# child:       Max(50)
# ext:         Max(30)
# mime:        Max(20)
# cat:         Max(20)
# *:           Max(0)
# have:        Req
# filetype:    Req
# git:         Req

# ------------------------------------------------------------ #

[rules]
default = [
    [["Directory"], ["1|directory/*"]],
    [["Application"], ["application"]],
    [["Text"], ["1|type:text"]],
    [["Image"], ["1|image/*"]],
    [
        ["Extract", "Metadata"],
        ["1|cat:document", "1|cat:spreadsheet", "1|cat:email", "1|cat:academic"],
    ], # try extracting, with fallback to metadata
    [["Metadata"], ["1|*/*"]],
]
preview = [
    [["sqlite"], ["application/vnd.sqlite3", "have:sqlite3"]],
]

# the 'n' alias, and the `Advance` action in the ui
# The Text rule outranks the default `application` rule (60) so that
# text-backed applications (.desktop files) open in the editor instead of
# launching — e.g. `Advance` in the apps pane on linux.
edit = [
    [["Open"], ["1|cat:document", "1|cat:spreadsheet", "1|cat:email", "1|cat:academic"]],
    [["Text"], ["100|type:text"]],
]

# the 'l' alias
display = [
    [
        ["Metadata"],
        [
            "1|cat:compressed",
        ],
    ],
]

# the 'la' alias
extended = []

# the 'll' alias
info = []

# opener
open = [] #  Metadata, Image, Text, Extract all defer to fs: open in this preset and the next

alternate = [
    [["none"], ["*/*"]],
]

[actions]
sqlite = '''
sqlite3 {} "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" |
while read -r tbl; do
    [[ -n $tbl ]] || continue;
    echo "== $tbl ($(sqlite3 {} "SELECT COUNT(*) FROM \"$tbl\";")) rows =="
    sqlite3 {} <<EOF
.headers on
.mode column
SELECT * FROM "$tbl" LIMIT 5;
EOF
    echo
done
'''
