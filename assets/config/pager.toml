# Pager configuration (bat passthrough into minus). See docs/pager.md.

# Bat passthrough args (fs only). Commenting out this line disables bat entirely.
bat_opts = ["--color=always", "--style=rule"]

# Show line numbers in the pager.
line_numbers = false

# Footer prompt text shown by the pager.
# prompt = ""

# Enable horizontal scrolling on start.
horizontal_scroll = false

# Smart case search: when enabled, queries with no uppercase characters
# match case-insensitively; queries containing uppercase stay case-sensitive.
smart_case = true

# When enabled, appends --style=+changes or --style=-changes to bat args
# based on whether the file has unstaged git changes.
smart_changes = true

# Command to run when the pager is given a directory path.
# {} is replaced with the directory path. Empty list disables this.
display_directory = ["fs", ":tool", "liza", ":u2", "--", "{}"]
