# This config file contains of active settings and inactive settings.
# Except for [smart_visibility], the inactive settings describe
# non-default behavior. Since f:ist is extensively configurable, these are left as
# a few of the options for which preference is particularly subjective, or which are
# likely to be of interest to users.

# For a full reference, consult the docs (https://squirreljetpack.github.io/fist-docs/configuration).

# === PANES ===
[panes.nav]
show_preview = 60

# ignore_patterns = [ ".DS_Store" ]
# default_visibility = { hidden = true }

[panes.find]
show_preview = 60
lock_prompt = "auto"

# exclusions = [ "~/.cache", "~/.Trash", "node_modules", "target" ]

[panes.search]
# Entering the Search pane leaves the query bar unlocked; the query is
# typed explicitly after the pane opens.
lock_prompt = "never"
show_preview = 20
preview_layout_index = 1

one_line = true
default_sort = "none"
empty_pattern = "-v ^ *$"

rg_status_template = '''
{blue:filter: ({})}\s \m/\t
'''
fs_status_template = '''
{red:query: ({})}\s \m/\t
'''

[panes.app]
preview_layout_index = 3
show_preview = true

# Only show apps that have icons. Defaults to true on macOS.
# require_icon = true

[panes.files]
default_sort = "atime"
prompt = "◷ > "
# prompt_style = { fg = "LightYellow" }

[panes.dirs]
default_sort = "frecency"
prompt = "◷ > "
# prompt_style = { fg = "LightYellow" }

# The unnamed default stash.
[panes.stashes.""]
prompt = "󰀻 > " # ⊞
prompt_style.modifier = "ITALIC"

# === SETTINGS ===

[smart_visibility]
# dot_query_show_hidden = true
# dot_query_show_ignored = false
# empty_folders = true
# git_repo = "auto"
# ignored_targets = true
# retain_filetype_filters = false

[notify]

[misc]

[history]
refind = "Search"
# Paths matching these globs are not recorded in history.
# exclude = ["~/ignore_exact", "/logs/secret/*"]

[queue]
# Keep completed queue rows after closing the queue overlay
# clear_completed_on_close = true

### MISC ###

[interface]
# hide the preview when in the query bar
# hide_preview_when_cursor_disabled = true

remove_db_record_action = "Trash" # Trash | Delete | None

# prompt prefix when in the query bar: https://squirreljetpack.github.io/fist-docs/16-output-templates#the-format-template
# cwd_prompt = '{2~2} '

# Copy the selected files to the system clipboard on Copy.
# copy_files_to_clipboard = false

# Cut the selected files to the system clipboard on Move (default: false).
# move_files_to_clipboard = true

# Bump the paths a menu action is triggered on, (including actions that only
# enqueue their targets).
# bump_menu_action_paths = true

# Bump the destinations of successful Copy, Move, and Symlink runs.
# bump_transfer_destinations = true
