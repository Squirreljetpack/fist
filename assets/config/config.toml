### PANES ###
[panes.nav]
show_preview = 60

# ignore_patterns = [ ".DS_Store" ]
# default_visibility = { hidden = true }

[panes.find]
show_preview = 60
lock_prompt = "auto"

[panes.search]
# Entering the Search pane leaves the query bar unlocked; the query is
# typed explicitly after the pane opens.
lock_prompt = "never"
show_preview = 20
preview_layout_index = 1

one_line = true
default_sort = "none"

rg_status_template = '''
{blue:filter: {}} \s\m/\t
'''
fs_status_template = '''
{red:query: {}} \s\m/\t
'''

[panes.app]
preview_layout_index = 3
show_preview = true

# Only show apps that have icons. Defaults to true on macOS.
# require_icon = true

[panes.files]
default_sort = "atime"
prompt = "◷> "
# prompt_style = { fg = "LightYellow" }

[panes.dirs]
default_sort = "frecency"
prompt = "◷> "
# prompt_style = { fg = "LightYellow" }

# The unnamed default stash.
[panes.stashes.""]
prompt = "⊞ > "
prompt_style.modifier = "ITALIC"

### SETTINGS ###

[smart_visibility]
# dot_query_show_hidden = true
# dot_query_show_ignored = false
# empty_folders = true
# git_repo = "auto"
# ignored_targets = true
# retain_filetype_filters = false

[fd]

[rg]
empty_pattern = "-v ^ *$"

[notify]

[misc]

[history]
refind = "Search"
# Paths matching these globs are not recorded in history. Patterns match the
# whole path, so add /* to cover everything beneath a directory.
# exclude = ["~/ignore_exact", "/logs/secret/*"]

[queue]
# Keep completed queue rows after closing the queue overlay (default: false)
# clear_completed_on_close = true

### MISC ###

[interface]
# hide the preview when in the query bar
# hide_preview_when_cursor_disabled = true
# allow_trash_db_items = true

# prompt prefix when in the query bar: https://squirreljetpack.github.io/fist-docs/16-output-templates#the-format-template
