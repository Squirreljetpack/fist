### PANES ###
[panes.nav]
show_preview = 60
lock_prompt = false

# default_visibility = { hidden = true }

[panes.find]
show_preview = 60
lock_prompt = true

[panes.search]
lock_prompt = true
show_preview = 20
preview_layout_index = 1

one_line = true
default_sort = "none"

rg_status_template = '''
{blue:filter: {}} \s\m/\t
'''
fs_status_template = '''
{red:query: {}} \s\m/\t
'''

[panes.app]
preview_layout_index = 3
show_preview = true

### STYLES ####

[styles]
### SETTINGS ###

[fd]
dot_query_show_hidden = "Always"

[rg]
empty_pattern = "-v ^ *$"

[notify]

[misc]

[history]
refind = "Search"

### ACTIONS ####

[actions]
### MISC ###

[interface]
prompt_locking = true
# hide the preview while locked onto the cwd (cursor_disabled)
hide_preview_when_cursor_disabled = false
