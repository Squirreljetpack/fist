### PANES ###
[panes.nav]
show_preview = 60
lock_prompt = false

# default_visibility = { hidden = true }

[panes.find]
show_preview = 60
lock_prompt = true

[panes.search]
lock_prompt = true
show_preview = 20
preview_layout_index = 1

one_line = true
default_sort = "none"

rg_status_template = '''
{blue:filter: {}} \s\m/\t
'''
fs_status_template = '''
{red:query: {}} \s\m/\t
'''

[panes.app]
preview_layout_index = 3
show_preview = true

[panes.stash]
# While populating, delete stash entries whose path no longer exists
# from the db (in addition to hiding them).
prune = true
# What to do when stashing a path that is already in the stash:
# "Replace" (remove the old entry and re-add, moving it to the end of the
# stash), "Skip" (keep the existing entry), "Duplicate" (add another entry).
insert = "replace"

