# CommandSpace config used only by the screenshot harness.
# Mirrors the user's alacritty gruvbox-material theme and Hack Nerd Font.
default_command = { program = "/bin/sh", args = ["/home/dev/tools-repo/run-fs.sh"] }
data_dir = "/home/dev/.local/state/commandspace"

[window]
opacity = 1.0
radius = 0
blur = false

[window.identity]
title = "fs"

[window.identity.class]
general = "FistShot"
instance = "fist-shot"

[window.frame]
thickness = 0.0
offset = 0.0
color = "#3c3836"
opacity = 0.0
directional_lighting = false

[window.padding]
x = 22
y = 18

[window.dimensions]
columns = 91
lines = 24

[font]
size = 20.0
builtin_box_drawing = true

[font.offset]
x = 0
y = 4

[font.normal]
family = "Hack Nerd Font"

[cursor]
style = "Block"
unfocused_hollow = true

[colors]
name = "gruvbox_material_dark"
indexed_colors = []
transparent_background_colors = false
draw_bold_text_with_bright_colors = false

[colors.primary]
foreground = "#dfbf8e"
background = "#282828"

[colors.cursor]
foreground = "CellBackground"
background = "CellForeground"

[colors.selection]
foreground = "CellBackground"
background = "CellForeground"

[colors.normal]
black = "#665c54"
red = "#ea6962"
green = "#a9b665"
yellow = "#e78a4e"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"
white = "#dfbf8e"

[colors.bright]
black = "#928374"
red = "#ea6962"
green = "#a9b665"
yellow = "#e3a84e"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"
white = "#dfbf8e"

[colors.search.focused_match]
foreground = "#181818"
background = "#f4bf75"

[colors.search.matches]
foreground = "#181818"
background = "#ac4242"

[colors.line_indicator]

[colors.hints.start]
foreground = "#181818"
background = "#f4bf75"

[colors.hints.end]
foreground = "#181818"
background = "#ac4242"

[colors.footer_bar]

[tabs]
style = "Segmented"
show_on_hover = true
visibility_delay = 2000
height = 0.0
font_size = 13.0
radius = 6.0

[misc]
start_at_login = false

[misc.lost_focus_ignore_duration]
secs = 1
nanos = 0
